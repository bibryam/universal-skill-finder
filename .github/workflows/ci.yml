name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py

  package-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m bandit -r skills/find/scripts scripts
      - run: python -m pip_audit -r requirements-dev.txt
      - run: python scripts/scan_secrets.py
      - run: python -m build
      - name: Install wheel in a clean environment and invoke outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/universal-skill-finder-wheel"
          "$RUNNER_TEMP/universal-skill-finder-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/universal-skill-finder-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/universal-skill-finder-wheel/bin/skill-find" doctor
          "$RUNNER_TEMP/universal-skill-finder-wheel/bin/skill-find" "pdf forms" --dry-run --json

  release-artifacts:
    needs: [test, package-and-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build checked candidate or tagged final archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/build_release.py --output-dir "$RUNNER_TEMP/universal-skill-finder-release" --final
          else
            python scripts/build_release.py --output-dir "$RUNNER_TEMP/universal-skill-finder-release"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-skill-finder-release-${{ github.sha }}
          path: ${{ runner.temp }}/universal-skill-finder-release/*
          if-no-files-found: error
          retention-days: 14
