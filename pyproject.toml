[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-skill-finder"
dynamic = ["version"]
description = "Search Agent Skills registries and repositories as one catalogue"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/bibryam/universal-skill-finder"
Repository = "https://github.com/bibryam/universal-skill-finder"
Issues = "https://github.com/bibryam/universal-skill-finder/issues"

[project.scripts]
skill-find = "universal_skill_finder.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/find/scripts" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["skills/find/scripts"]

[tool.setuptools.package-data]
universal_skill_finder = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "universal_skill_finder.__version__" }
